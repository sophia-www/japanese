<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="N1">
<link rel="apple-touch-icon" href="icon.png">
<title>N1 特訓引擎</title>
<style>
  :root{
    --shironeri:#F3F3F2; --gofun:#FFFFFB; --sumi:#1C1C1C; --aisumi:#4B4B4B;
    --shironezumi:#DCDDDD; --ginnezumi:#91989F; --ainezumi:#6C848D; --uguisucha:#6C6024;
    --chitose:#316745; --edomurasaki:#745399; --tokiwa:#007B43; --suoh:#9E3D3F;
    --suoh-bg:#F4E7E7; --tokiwa-bg:#E4EFE8;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--shironeri);color:var(--sumi);line-height:1.75;-webkit-font-smoothing:antialiased;
       font-family:"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  .jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Songti TC",serif}
  ruby{ruby-position:over}
  rt{font-size:.5em;color:var(--aisumi);font-weight:400;letter-spacing:0}
  .hasruby{line-height:2.5}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px 90px}
  header{position:sticky;top:0;z-index:10;background:rgba(243,243,242,.95);backdrop-filter:blur(6px);
         border-bottom:1px solid var(--shironezumi)}
  .head-in{max-width:680px;margin:0 auto;padding:11px 18px 0}
  .title{display:flex;align-items:center;gap:9px}
  .title h1{font-size:16.5px;margin:0;letter-spacing:.04em;white-space:nowrap}
  .title .sub{font-size:11.5px;color:var(--aisumi);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .furi{margin-left:auto;font-size:11.5px;padding:3px 9px;border:1px solid var(--shironezumi);
        background:var(--gofun);border-radius:2px;cursor:pointer;font-family:inherit;color:var(--aisumi);white-space:nowrap}
  .furi b{color:var(--sumi)}
  .bar{height:3px;background:var(--shironezumi);border-radius:2px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ainezumi);width:0;transition:width .4s}
  nav{display:flex;gap:1px;margin-top:8px}
  nav button{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:9px 1px 8px;
             font:inherit;font-size:13px;color:var(--ginnezumi);cursor:pointer}
  nav button[aria-selected="true"]{color:var(--sumi);border-bottom-color:var(--suoh);font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0 12px}
  select,.btn,textarea,input{font:inherit;font-size:14px;border:1px solid var(--shironezumi);
    background:var(--gofun);color:var(--sumi);border-radius:2px}
  select,.btn{padding:7px 12px;cursor:pointer}
  .btn:hover{border-color:var(--ginnezumi)}
  .btn.primary{background:var(--ainezumi);border-color:var(--ainezumi);color:#fff}
  .btn.shu{background:var(--suoh);border-color:var(--suoh);color:#fff}
  .count{font-size:13px;color:var(--aisumi);margin-left:auto}
  .panel{background:var(--gofun);border:1px solid var(--shironezumi);padding:20px}
  .panel.b{border-left:4px solid var(--ainezumi)}
  .s-文法{--sc:var(--ainezumi)} .s-語彙{--sc:var(--uguisucha)}
  .s-読解{--sc:var(--chitose)} .s-聴解{--sc:var(--edomurasaki)}
  .panel.sub{border-left:4px solid var(--sc)}
  .cat{font-size:11.5px;color:var(--sc,var(--ginnezumi));letter-spacing:.08em}
  .big{font-size:38px;line-height:1.2;margin:2px 0}
  .pat{font-size:30px;line-height:1.4;margin:5px 0 2px}
  .conn{font-size:13px;color:var(--aisumi);border-bottom:1px dotted var(--shironezumi);padding-bottom:12px}
  .mean{font-size:16.5px;margin:12px 0 0;font-weight:600}
  .ex{margin-top:12px;font-size:18px;line-height:2.4}
  .ex mark,.fb mark{background:var(--suoh-bg);color:var(--suoh);padding:0 2px}
  .zh{font-size:13.5px;color:var(--aisumi);margin-top:4px;line-height:1.7}
  .note{margin-top:12px;font-size:13.5px;background:var(--tokiwa-bg);border-left:3px solid var(--tokiwa);padding:8px 11px}
  .pas{font-size:16.5px;line-height:2.2;background:var(--shironeri);border:1px solid var(--shironezumi);
       padding:14px 15px;margin-bottom:14px;text-align:justify}
  .hidden{display:none}
  .stem{font-size:18px;line-height:2.2;margin:6px 0 14px}
  .blank{display:inline-block;min-width:92px;border-bottom:2px solid var(--suoh);text-align:center;color:var(--suoh)}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;background:var(--gofun);border:1px solid var(--shironezumi);padding:11px 13px;
       font:inherit;font-size:16px;border-radius:2px;cursor:pointer;line-height:1.7}
  .opt:hover:not(:disabled){border-color:var(--ainezumi)}
  .opt.right{border-color:var(--tokiwa);background:var(--tokiwa-bg)}
  .opt.wrong{border-color:var(--suoh);background:var(--suoh-bg)}
  .opt.pick{border-color:var(--ainezumi);background:#EDF1F2}
  .fb{margin-top:14px;border-top:1px dotted var(--shironezumi);padding-top:12px;font-size:14.5px}
  .verdict{font-weight:700}.verdict.ok{color:var(--tokiwa)}.verdict.ng{color:var(--suoh)}
  details{border-top:1px solid var(--shironezumi);padding:9px 0}
  summary{font-size:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"＋";color:var(--ainezumi);margin-right:7px;font-weight:400}
  details[open] summary::before{content:"−"}
  details .in{font-size:14px;padding:6px 0 4px 20px;line-height:1.85}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  th,td{text-align:left;padding:8px 7px;border-bottom:1px solid var(--shironezumi);vertical-align:top}
  th{font-size:11.5px;color:var(--aisumi);font-weight:600}
  .empty{color:var(--aisumi);font-size:14px;padding:24px 0;text-align:center}
  .stat{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 4px}
  .stat div span{display:block;font-size:26px;line-height:1.2}
  .stat div small{font-size:11.5px;color:var(--aisumi)}
  .link{background:none;border:none;color:var(--suoh);font:inherit;font-size:13px;cursor:pointer;
        text-decoration:underline;padding:0}
  textarea{width:100%;min-height:130px;padding:10px;font-size:12px;line-height:1.5;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  h3{font-size:14.5px;margin:24px 0 3px}
  p.desc{font-size:13px;color:var(--aisumi);margin:3px 0 8px}
  .timer{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
  .timer.warn{color:var(--suoh)}
  .grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .grid button{width:32px;height:32px;font:inherit;font-size:12px;border:1px solid var(--shironezumi);
               background:var(--gofun);cursor:pointer;border-radius:2px}
  .grid button.done{background:var(--ainezumi);color:#fff;border-color:var(--ainezumi)}
  .grid button.cur{outline:2px solid var(--suoh)}
  .chip{display:inline-block;font-size:11.5px;padding:1px 7px;border:1px solid var(--sc,var(--ginnezumi));
        color:var(--sc,var(--aisumi));border-radius:2px;margin-right:5px}
  .cal{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:8px}
  .cal i{aspect-ratio:1;background:var(--shironezumi);border-radius:1px}
  .cal i.on{background:var(--ainezumi)}
  .wtab{font-size:12px;color:var(--aisumi);margin-top:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="head-in">
  <div class="title"><h1>N1 特訓引擎</h1><span class="sub" id="sub"></span>
    <button class="furi" id="fbtn"></button></div>
  <div class="bar"><i id="bar"></i></div>
  <nav role="tablist">
    <button role="tab" data-view="today" aria-selected="true">今日</button>
    <button role="tab" data-view="learn" aria-selected="false">學習</button>
    <button role="tab" data-view="drill" aria-selected="false">練習</button>
    <button role="tab" data-view="exam" aria-selected="false">模考</button>
    <button role="tab" data-view="rec" aria-selected="false">紀錄</button>
  </nav>
</div></header>
<div class="wrap">
  <section id="v-today"></section><section id="v-learn" class="hidden"></section>
  <section id="v-drill" class="hidden"></section><section id="v-exam" class="hidden"></section>
  <section id="v-rec" class="hidden"></section>
</div>
<script>
/* 振假名標記：漢字《かな》，需指定起點時用 ｜漢字《かな》 */
/* 題庫在 data/*.json，啟動時載入。見 CLAUDE.md */

/* ==================== 狀態 ==================== */
const EXAM_DATE="2026-12-06",RUSH="2026-10-30",PLAN_START="2026-07-16";
const STEP=[1,3,7,14,30],SLOW=10000,VERYSLOW=12000,DAILY_CAP=40,DAY_CUT=4;
const KEY="n1trainer:v3";
const WEEK_SUBJ={1:"文法",2:"語彙",3:"文法",4:"聴解",5:"文法",6:"語彙",7:"文法",8:"綜合"};
const TIME={"文法":15,"語彙":10,"読解":20,"聴解":15,"綜合":30};
const SUBJ=["語彙","文法","読解","聴解"];
const FURI=["explain","all","off"],FURI_LABEL={all:"全開",explain:"只在解說",off:"關閉"};
let state={rec:{},log:[],exams:[],packs:[],custom:[],furi:"explain",manual:[],queue:[],snapDate:null};
let ITEMS=[],view="today",sess=null,exam=null,tick=null;
const $=id=>document.getElementById(id);
/* 本地日期，凌晨 4 點為日界線 */
function today(){const d=new Date();d.setHours(d.getHours()-DAY_CUT);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const days=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
function addDays(n){const d=new Date();d.setHours(d.getHours()-DAY_CUT);d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
/* 振假名：on 為 true 轉 ruby，否則移除標記 */
function ruby(s,on){
  if(!on)return String(s).replace(/｜/g,"").replace(/《.*?》/g,"");
  return String(s)
    .replace(/｜([^《]+)《(.+?)》/g,"<ruby>$1<rt>$2</rt></ruby>")
    .replace(/([\u4E00-\u9FFF々ヶ]+)《(.+?)》/g,"<ruby>$1<rt>$2</rt></ruby>");
}
const showQ=()=>state.furi==="all";                       // 題目是否顯示
const showA=()=>state.furi!=="off";                        // 解說是否顯示
const jq=s=>ruby(esc(s),showQ());
const ja_=s=>ruby(esc(s),showA());
const nlq=s=>jq(s).replace(/\n/g,"<br>");
const nla=s=>ja_(s).replace(/\n/g,"<br>");
const rubyCls=on=>on?"hasruby":"";
const inner=s=>{const m=s.match(/\{\{(.+?)\}\}/);return m?m[1]:"";};
const plain=s=>ruby(s,false);
const markedA=s=>ja_(s).replace(/\{\{(.+?)\}\}/,"<mark>$1</mark>");
const blankedQ=s=>jq(s).replace(/\{\{(.+?)\}\}/,'<span class="blank">＿＿＿</span>');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const week=()=>Math.max(1,Math.floor(days(PLAN_START,today())/7)+1);

/* ==================== 題庫 ==================== */
/* data/index.json 列出題庫檔；data/build.json 由 Netlify 建置時產生（版本資訊） */
let BANK={files:[],items:[],build:null,err:""};
async function getJSON(url){
  const r=await fetch(url,{cache:"no-cache"});
  if(!r.ok)throw new Error(url+" "+r.status);
  return r.json();
}
async function loadBank(){
  try{
    const idx=await getJSON("data/index.json");
    const parts=await Promise.all(idx.files.map(f=>getJSON("data/"+f)));
    BANK.items=[];
    parts.forEach(p=>p.items.forEach(d=>{
      if(d.retired)return;
      BANK.items.push({...d,s:d.s||p.subject,t:d.t||p.type});
    }));
    BANK.files=idx.files.map((f,i)=>({f,subject:parts[i].subject,n:parts[i].items.filter(x=>!x.retired).length}));
    BANK.err="";
  }catch(e){BANK.err=String(e.message||e);}
  try{BANK.build=await getJSON("data/build.json");}catch(e){BANK.build=null;}
}
function buildItems(){
  ITEMS=BANK.items.slice();
  const idx={};ITEMS.forEach((x,i)=>idx[x.id]=i);
  /* 舊版在手機上匯入的題包：repo 已有同 ID 時以 repo 為準 */
  (state.custom||[]).forEach(d=>{
    if(!d.id||idx[d.id]!==undefined)return;
    idx[d.id]=ITEMS.length;
    ITEMS.push({...d,s:d.s||"文法",t:d.t||(d.ja?"cloze":d.pas?"read":d.sc?"listen":"mc")});
  });
}
/* 儲存轉接層：Claude 環境用 window.storage，其他環境用 localStorage */
const STORE=(()=>{
  const claude=typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function";
  let mode=claude?"claude":"local",ok=true,checked=false;
  return{
    mode:()=>mode,ok:()=>ok,checked:()=>checked,
    label:()=>mode==="claude"?"Claude 帳號":"此瀏覽器",
    async get(k){
      if(mode==="claude"){try{const r=await window.storage.get(k);return r&&r.value?r.value:null;}catch(e){return null;}}
      try{return localStorage.getItem(k);}catch(e){ok=false;return null;}
    },
    async set(k,v){
      try{
        if(mode==="claude")await window.storage.set(k,v);
        else localStorage.setItem(k,v);
        ok=true;checked=true;
      }catch(e){ok=false;checked=true;}
    }
  };
})();
/* Notion 同步：失敗自動排隊，下次補送 */
const SYNC={
  url:"/.netlify/functions/notion-sync",
  deployed(){return location.protocol==="https:"&&!/claude|anthropic|usercontent/.test(location.hostname);},
  enabled(){return SYNC.deployed()&&state.notion!==false;},
  pending(){return (state.queue||[]).length;},
  /* 第一次在線上開啟時測一次連線：伺服器回錯誤（未設定 token 等）就自動關閉同步 */
  async autodetect(){
    if(!SYNC.deployed()||state.notion!==undefined||!navigator.onLine)return;
    try{const r=await fetch(SYNC.url+"?ping=1");
      state.notion=r.ok;if(!r.ok)state.queue=[];await save();}catch(e){}
  },
  async push(rec){
    if(!SYNC.enabled())return{sent:0,left:0};
    state.queue=[...(state.queue||[]),rec].slice(-60);await save();
    return SYNC.flush();
  },
  async flush(){
    if(!SYNC.enabled()||!SYNC.pending())return{sent:0,left:SYNC.pending()};
    let sent=0;
    for(const r of [...state.queue]){
      try{
        const res=await fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify(r)});
        if(!res.ok)throw new Error(await res.text());
        state.queue=state.queue.filter(x=>x.uid!==r.uid);
        sent++;await save();
      }catch(e){break;}                      /* 一失敗就停，保持順序 */
    }
    badge();
    return{sent,left:SYNC.pending()};
  },
  async ping(){
    const res=await fetch(SYNC.url+"?ping=1");
    return{ok:res.ok,body:await res.text()};
  }
};
function badge(){
  const el=$("syncb");if(!el)return;
  const n=SYNC.pending();
  const show=SYNC.enabled()&&n>0;
  el.textContent=show?` ・ Notion 未同步 ${n}`:"";
  el.style.color="var(--suoh)";
}
function record(kind,subjects,total,right,avgSec,weakList){
  return{uid:`${kind}-${Date.now()}`,kind,
    name:`${today().slice(5)} ${new Date().toTimeString().slice(0,5)} ${kind}・${subjects.join("")}`,
    date:new Date().toISOString(),subjects,total,right,
    avgSec:Math.round(avgSec*10)/10,week:week(),streak:streak(),
    weak:weakList.slice(0,25).join("、"),
    json:{items:total,right,subjects,detail:weakList}};
}
async function syncSession(kind,qs,right,ms,wrongList){
  const subs=[...new Set(qs.map(q=>q.item.s))];
  const weak=wrongList.map(w=>plain(w.it.t==="cloze"?w.it.p:(w.it.o?w.it.o[w.it.a]:""))+
    `→${plain(w.pick)}`);
  await SYNC.push(record(kind,subs,qs.length,right,ms/1000/qs.length,weak));
  if(state.snapDate!==today()){                /* 每日一次完整快照 */
    state.snapDate=today();
    const snap=record("狀態快照",SUBJ,ITEMS.length,
      ITEMS.filter(i=>(state.rec[i.id]||{}).stage>=3).length,0,
      weakItems().map(d=>plain(d.t==="cloze"?d.p:(d.o?d.o[d.a]:""))));
    snap.json=buildReport();
    snap.json.rec=state.rec;                   /* 完整排程狀態，供新對話重建 */
    await SYNC.push(snap);
  }
}
async function load(){try{const v=await STORE.get(KEY);if(v)state={...state,...JSON.parse(v)};}catch(e){}}
async function save(){await STORE.set(KEY,JSON.stringify(state));if(!STORE.ok())warnStore();}
let warned=false;
function warnStore(){
  if(warned)return;warned=true;
  const d=document.createElement("div");
  d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#9E3D3F;color:#fff;"+
    "padding:11px 16px;font-size:13.5px;line-height:1.6";
  d.innerHTML='儲存失敗，這次的作答不會被保留。可能是瀏覽器處於無痕模式或儲存空間已滿。'+
    '<button style="margin-left:10px;background:none;border:1px solid #fff;color:#fff;'+
    'padding:2px 9px;border-radius:2px;font:inherit;font-size:12.5px" onclick="this.parentNode.remove()">知道了</button>';
  document.body.appendChild(d);
}

/* ==================== SRS ==================== */
function interval(stage,slow){
  let d=STEP[Math.min(stage,4)];
  if(slow)d=STEP[Math.max(0,Math.min(stage,4)-1)];
  const left=days(today(),EXAM_DATE);
  if(today()>=RUSH)d=Math.min(d,7);
  return Math.max(1,Math.min(d,Math.max(1,Math.floor(left/2))));
}
function grade(item,ok,ms,pick){
  const r=state.rec[item.id]||{stage:0,seen:0,wrong:0,hist:[],graded:null};
  r.seen++;
  if(!ok){r.stage=0;r.wrong++;}
  else if(ms<SLOW)r.stage=Math.min(r.stage+1,4);
  const slow=ok&&ms>=SLOW;
  if(r.graded!==today()||!ok){r.due=ok?addDays(interval(r.stage,slow)):addDays(1);r.graded=today();}
  r.ms=ms;
  r.hist.push({d:today(),ok:ok?1:0,s:Math.round(ms/100)/10,pick:ok?"":plain(pick)});
  if(r.hist.length>12)r.hist=r.hist.slice(-12);
  state.rec[item.id]=r;
  state.log.push({id:item.id,sub:item.s,d:today(),ok:ok?1:0,s:Math.round(ms/100)/10});
  if(state.log.length>1200)state.log=state.log.slice(-1200);
  save();
}
const dueItems=()=>ITEMS.filter(i=>state.rec[i.id]&&state.rec[i.id].due<=today())
  .sort((a,b)=>state.rec[a.id].due<state.rec[b.id].due?-1:1);
const newItems=()=>ITEMS.filter(i=>!state.rec[i.id]);
const weakItems=()=>ITEMS.filter(i=>{const r=state.rec[i.id];
  return r&&r.wrong>0&&(r.stage<=1||r.wrong/r.seen>=0.34);});
const doneToday=()=>state.log.filter(l=>l.d===today()).length;
function activeDays(){const s=new Set(state.log.map(l=>l.d));(state.manual||[]).forEach(d=>s.add(d));return s;}
function streak(){
  const s=activeDays();let n=0,i=0;
  if(!s.has(today()))i=1;                       // 今天還沒做，從昨天起算
  for(;;i++){const d=addDays(-i);if(s.has(d))n++;else break;}
  return n;
}
function todayPool(n,sub){
  const f=i=>!sub||i.s===sub;
  const due=dueItems().filter(f),nw=newItems().filter(f);
  const quota=Math.max(1,Math.round(n*0.25));
  const dueTake=due.slice(0,Math.max(0,n-Math.min(quota,nw.length)));
  return [...dueTake,...nw.slice(0,n-dueTake.length)];
}
function refreshHead(){
  const m=ITEMS.filter(i=>(state.rec[i.id]||{}).stage>=3).length;
  $("bar").style.width=(ITEMS.length?m/ITEMS.length*100:0)+"%";
  $("sub").textContent=`W${week()} ・ ${days(today(),EXAM_DATE)} 天 ・ 熟練 ${m}/${ITEMS.length}`;
  $("fbtn").innerHTML=`ふりがな <b>${FURI_LABEL[state.furi]}</b>`;
}
function makeQ(item){
  if(item.t==="cloze"){
    const right=inner(item.ja);
    const same=ITEMS.filter(x=>x.t==="cloze"&&x.c===item.c&&inner(x.ja)!==right);
    const pool=same.length>=3?same:ITEMS.filter(x=>x.t==="cloze"&&inner(x.ja)!==right);
    const dis=[...new Set(shuffle(pool).map(x=>inner(x.ja)))].slice(0,3);
    return{item,opts:shuffle([right,...dis]),right};
  }
  return{item,opts:shuffle(item.o),right:item.o[item.a]};
}

/* ==================== 練習 ==================== */
function start(pool){if(!pool.length)return;
  sess={qs:shuffle(pool).map(makeQ),i:0,right:0,wrong:[],t0:0,shown:false};
  switchView("drill");renderQ();}
function renderQ(){
  if(!sess)return renderDrillHome();
  if(sess.i>=sess.qs.length)return renderResult();
  const q=sess.qs[sess.i],it=q.item;sess.t0=Date.now();
  const head=`<div class="row"><span class="count" style="margin:0">第 ${sess.i+1} / ${sess.qs.length} 題　正確 ${sess.right}</span></div>`;
  if(it.t==="listen"&&!sess.shown)return renderScript(head,it);
  $("v-drill").innerHTML=head+`
    <div class="panel sub s-${it.s}">
      <div class="cat">${it.s}・${it.c}</div>
      ${it.t==="read"?`<div class="pas jp ${rubyCls(showQ())}">${nlq(it.pas)}</div>`:""}
      <div class="stem jp ${rubyCls(showQ())}">${it.t==="cloze"?blankedQ(it.ja):jq(it.q)}</div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt jp ${rubyCls(showQ())}" data-i="${i}">${"ABCD"[i]}　${jq(o)}</button>`).join("")}</div>
      <div id="fb"></div></div>`;
  $("v-drill").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
}
function renderScript(head,it){
  let left=25;
  $("v-drill").innerHTML=head+`
    <div class="panel sub s-聴解">
      <div class="cat">聴解・${it.c}　原稿速讀</div>
      <div class="pas jp ${rubyCls(showQ())}">${nlq(it.sc)}</div>
      <div class="row" style="margin-bottom:0"><span class="timer" id="cd">${left} 秒後隱藏</span>
        <button class="btn primary" id="ok" style="margin-left:auto">看題目</button></div>
      <p class="desc">原稿只顯示一次，模擬只能聽一遍的限制。</p></div>`;
  const t=setInterval(()=>{left--;if($("cd"))$("cd").textContent=left+" 秒後隱藏";
    if(left<=0){clearInterval(t);sess.shown=true;renderQ();}},1000);
  $("ok").onclick=()=>{clearInterval(t);sess.shown=true;renderQ();};
}
function deepHTML(d){
  if(!d.D)return"";
  const D=d.D;
  return `
  <details open><summary>為什麼是這個意思</summary><div class="in">${D.br||""}</div></details>
  ${D.w?`<details><summary>構成單字</summary><div class="in"><table><tbody>
    ${D.w.map(w=>`<tr><td class="jp" style="white-space:nowrap">${w[0]}${w[1]?`　<span style="color:var(--aisumi);font-size:12.5px">${w[1]}</span>`:""}</td><td>${w[2]}</td></tr>`).join("")}
    </tbody></table></div></details>`:""}
  ${D.t?`<details><summary>前後接什麼</summary><div class="in jp ${rubyCls(showA())}">${ja_(D.t)}</div></details>`:""}
  ${D.st?`<details><summary>文體與使用場面</summary><div class="in">${D.st}</div></details>`:""}
  ${D.er?`<details><summary>常見誤用</summary><div class="in jp ${rubyCls(showA())}">${nla(D.er)}</div></details>`:""}
  ${D.ex?`<details><summary>考試怎麼考</summary><div class="in">${D.ex}</div></details>`:""}`;
}
function answer(btn,q){
  const ms=Date.now()-sess.t0,pick=q.opts[+btn.dataset.i],ok=pick===q.right,it=q.item;
  $("v-drill").querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;
    if(q.opts[i]===q.right)b.classList.add("right");else if(b===btn)b.classList.add("wrong");});
  sess.ms=(sess.ms||0)+ms;
  if(ok)sess.right++;else sess.wrong.push({it,pick});
  grade(it,ok,ms,pick);refreshHead();
  const r=state.rec[it.id];
  const body=it.t==="cloze"
    ?`<b class="jp" style="font-size:17px">${it.p}</b>　${it.m}<br>
      <span class="jp ${rubyCls(showA())}" style="font-size:16.5px">${markedA(it.ja)}</span><br><span class="zh">${it.zh}</span><br>
      <span style="color:var(--aisumi)">接続：<span class="jp">${it.k}</span></span>`
    :`<b class="jp ${rubyCls(showA())}" style="font-size:17px">${ja_(q.right)}</b><br>${it.m}`;
  $("fb").innerHTML=`<div class="fb">
    <span class="verdict ${ok?"ok":"ng"}">${ok?"正解":"再確認"}</span>
    <span style="color:var(--aisumi);font-size:13px">　${(ms/1000).toFixed(1)} 秒 ・階段 ${r.stage} ・下次 ${r.due}</span><br>
    ${body}${it.n?`<div class="note">辨析：${it.n}</div>`:""}
    ${it.t==="listen"?`<div class="note"><b>原稿</b><br><span class="jp ${rubyCls(showA())}">${nla(it.sc)}</span></div>`:""}
    ${deepHTML(it)}
    <div class="row" style="margin-bottom:0">
      <button class="btn primary" id="nx">${sess.i===sess.qs.length-1?"看結果":"下一題"}</button></div></div>`;
  $("nx").onclick=()=>{sess.i++;sess.shown=false;renderQ();};
}
function renderResult(){
  const rate=Math.round(sess.right/sess.qs.length*100),w=sess.wrong;
  if(!sess.synced){sess.synced=true;syncSession("練習紀錄",sess.qs,sess.right,sess.ms||0,w);}

/* ==================== 模考 ==================== */
/* 全真：JLPT N1 言語知識（文字・語彙・文法）・読解，正式 110 分。
   每題時間預算：語彙 0.6、文法 1、読解 3 分（25+20+25 題＝110 分）；題庫不足時按比例縮短 */
const FULL={order:["語彙","文法","読解"],n:{"語彙":25,"文法":20,"読解":25},min:{"語彙":.6,"文法":1,"読解":3}};
const recSubject=w=>WEEK_SUBJ[w]||(today()>=RUSH?"全真":"綜合");
function renderExam(){
  if(exam)return exam.done?renderExamResult():renderExamQ();
  const w=week(),rec=recSubject(w),past=state.exams.slice(-6).reverse();
  $("v-exam").innerHTML=`
   <div class="panel b"><div class="cat">第 ${w} 週模擬考</div>
     <div class="mean">本週建議：${rec==="全真"?"全真模考（言語知識＋読解）":rec}</div>
     <p class="desc">考試中不顯示正誤，可自由跳題，時間到自動交卷。<br>
       離開 App 或切到其他分頁時<b>計時暫停、作答保留</b>，通勤可分段考完。</p>
     <div class="row" style="margin-bottom:0">
       <select id="es">${["全真","綜合",...SUBJ].map(s=>`<option${s===rec?" selected":""} value="${s}">${s==="全真"?"全真（言語知識＋読解）":s}</option>`).join("")}</select>
       <select id="en"><option>15</option><option>25</option><option>40</option></select>
       <button class="btn shu" id="eg">開始考試</button></div>
     <p class="desc" id="einfo"></p></div>
   <h3>歷次成績</h3>
   ${past.length?`<table><thead><tr><th>日期</th><th>科目</th><th>正確率</th><th>各科</th></tr></thead><tbody>
     ${past.map(e=>`<tr><td>${e.date}</td><td>${e.subject}</td><td>${e.rate}％</td>
       <td style="font-size:12px">${Object.entries(e.bySub).map(([k,v])=>`${k} ${Math.round(v.r/v.t*100)}％`).join("<br>")}</td></tr>`).join("")}
     </tbody></table>`:`<div class="empty">尚無紀錄。</div>`}`;
  const info=()=>{const full=$("es").value==="全真";$("en").classList.toggle("hidden",full);
    if(!full){$("einfo").textContent="";return;}
    const p=fullPlan();
    $("einfo").innerHTML=`${p.parts.map(x=>`${x.s} ${x.n} 題`).join("・")}，限時 ${Math.round(p.min)} 分`+
      (p.short?`<br>題庫不足正式題數，時間已按比例縮短（正式 110 分）。`:"");};
  $("es").onchange=info;info();
  $("eg").onclick=()=>startExam($("es").value,+$("en").value);
}
function fullPlan(){
  const parts=FULL.order.map(s=>({s,n:Math.min(FULL.n[s],ITEMS.filter(i=>i.s===s).length)}));
  const min=parts.reduce((a,x)=>a+x.n*FULL.min[x.s],0);
  return{parts,min,short:parts.some(x=>x.n<FULL.n[x.s])};
}
/* 讀解同一篇文章的題目排在一起 */
function groupPassages(list){
  const out=[],seen=new Set();
  list.forEach(i=>{if(seen.has(i.id))return;
    const same=i.pas?list.filter(x=>x.pas===i.pas):[i];
    same.forEach(x=>{seen.add(x.id);out.push(x);});});
  return out;
}
function startExam(subject,n){
  let pool,lim;
  if(subject==="全真"){
    const p=fullPlan();pool=[];
    p.parts.forEach(x=>{const take=shuffle(ITEMS.filter(i=>i.s===x.s)).slice(0,x.n);
      pool.push(...(x.s==="読解"?groupPassages(take):take));});
    lim=Math.round(p.min*60);
  }else{
    if(subject==="綜合"){
      const per={"文法":Math.round(n*.35),"語彙":Math.round(n*.3),"読解":Math.round(n*.2)};
      per["聴解"]=n-per["文法"]-per["語彙"]-per["読解"];
      pool=[];SUBJ.forEach(s=>pool.push(...shuffle(ITEMS.filter(i=>i.s===s)).slice(0,Math.max(0,per[s]))));
    }else pool=shuffle(ITEMS.filter(i=>i.s===subject)).slice(0,n);
    pool=shuffle(pool);lim=(TIME[subject]||20)*60;
  }
  if(pool.length<3)return alert("該科題數不足。");
  exam={subject,qs:pool.map(makeQ),i:0,ans:{},limit:lim,left:lim,done:false,shown:{}};
  saveExam();switchView("exam");renderExamQ();startTick();
}
/* 作答中的考試存進 state，關掉 App 也能續考 */
function saveExam(){
  state.exam=exam&&!exam.done?{subject:exam.subject,ids:exam.qs.map(q=>q.item.id),
    opts:exam.qs.map(q=>q.opts),right:exam.qs.map(q=>q.right),
    i:exam.i,ans:exam.ans,limit:exam.limit,left:exam.left,shown:exam.shown}:null;
  save();
}
function resumeExam(){
  const e=state.exam,byId={};ITEMS.forEach(i=>byId[i.id]=i);
  const qs=[],ans={},shown={};
  e.ids.forEach((id,k)=>{if(!byId[id])return;
    if(e.ans[k]!==undefined)ans[qs.length]=e.ans[k];
    if(e.shown&&e.shown[k])shown[qs.length]=true;
    qs.push({item:byId[id],opts:e.opts[k],right:e.right[k]});});
  if(!qs.length){state.exam=null;save();return;}
  exam={subject:e.subject,qs,i:Math.min(e.i,qs.length-1),ans,limit:e.limit,left:e.left,done:false,shown};
  startTick();
}
function startTick(){clearInterval(tick);
  tick=setInterval(()=>{if(!exam||exam.done)return clearInterval(tick);
    if(view!=="exam"||document.visibilityState!=="visible")return;   /* 暫停 */
    exam.left--;const el=$("cd2");
    if(el){el.textContent=fmt(exam.left);el.classList.toggle("warn",exam.left<120);}
    if(exam.left%15===0)saveExam();
    if(exam.left<=0){clearInterval(tick);submitExam();}},1000);}
document.addEventListener("visibilitychange",()=>{if(exam&&!exam.done)saveExam();});
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function renderExamQ(){
  const q=exam.qs[exam.i],it=q.item,cur=exam.ans[exam.i];
  const hide=it.t==="listen"&&!exam.shown[exam.i];
  $("v-exam").innerHTML=`
   <div class="row"><span class="timer" id="cd2">${fmt(exam.left)}</span>
     <span class="count">第 ${exam.i+1} / ${exam.qs.length} 題　已答 ${Object.keys(exam.ans).length}</span></div>
   <div class="panel sub s-${it.s}"><div class="cat">${it.s}・${it.c}</div>
     ${it.t==="read"?`<div class="pas jp ${rubyCls(showQ())}">${nlq(it.pas)}</div>`:""}
     ${it.t==="listen"?(hide?`<div class="pas jp ${rubyCls(showQ())}">${nlq(it.sc)}</div>
        <div class="row"><button class="btn primary" id="hd">讀完，看題目</button></div>`
        :`<p class="desc">原稿已隱藏</p>`):""}
     ${hide?"":`<div class="stem jp ${rubyCls(showQ())}">${it.t==="cloze"?blankedQ(it.ja):jq(it.q)}</div>
     <div class="opts">${q.opts.map((o,i)=>`<button class="opt jp ${rubyCls(showQ())} ${cur===i?"pick":""}" data-i="${i}">${"ABCD"[i]}　${jq(o)}</button>`).join("")}</div>`}
   </div>
   <div class="row"><button class="btn" id="pv">← 上一題</button><button class="btn" id="nx2">下一題 →</button>
     <button class="btn shu" id="sb2" style="margin-left:auto">交卷</button></div>
   <div class="grid">${exam.qs.map((_,i)=>`<button data-j="${i}" class="${exam.ans[i]!==undefined?"done":""} ${i===exam.i?"cur":""}">${i+1}</button>`).join("")}</div>
   <div class="row"><button class="link" id="ab">放棄這次考試</button><span class="count">離開時計時暫停</span></div>`;
  if($("hd"))$("hd").onclick=()=>{exam.shown[exam.i]=true;saveExam();renderExamQ();};
  $("v-exam").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{exam.ans[exam.i]=+b.dataset.i;saveExam();
    if(exam.i<exam.qs.length-1)exam.i++;renderExamQ();});
  $("pv").onclick=()=>{if(exam.i>0){exam.i--;renderExamQ();}};
  $("nx2").onclick=()=>{if(exam.i<exam.qs.length-1){exam.i++;renderExamQ();}};
  $("sb2").onclick=()=>{const left=exam.qs.length-Object.keys(exam.ans).length;
    if(confirm(left?`還有 ${left} 題未作答，確定交卷？`:"確定交卷？"))submitExam();};
  $("ab").onclick=()=>{if(confirm("放棄這次考試？作答不會計分。")){clearInterval(tick);exam=null;saveExam();renderExam();}};
  $("v-exam").querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{exam.i=+b.dataset.j;renderExamQ();});
}
function submitExam(){
  clearInterval(tick);
  const bySub={},wrong=[];let right=0;
  const used=Math.round((exam.limit-exam.left)/exam.qs.length*1000);
  exam.qs.forEach((q,i)=>{
    const pick=exam.ans[i]!==undefined?q.opts[exam.ans[i]]:null,ok=pick===q.right;
    if(ok)right++;
    const s=q.item.s;bySub[s]=bySub[s]||{t:0,r:0};bySub[s].t++;if(ok)bySub[s].r++;
    if(!ok)wrong.push({it:q.item,pick:pick||"（未作答）",right:q.right});
    if(pick!==null)grade(q.item,ok,used,pick);});   /* 未作答只算分數，不影響複習排程 */
  const rate=Math.round(right/exam.qs.length*100);
  state.exams.push({date:today(),week:week(),subject:exam.subject,total:exam.qs.length,right,rate,bySub,
    wrong:wrong.map(w=>({k:plain(w.it.t==="cloze"?w.it.p:w.right),s:w.it.s,c:w.it.c,pick:plain(w.pick)}))});
  exam.done=true;state.exam=null;save();refreshHead();exam.result={rate,right,bySub,wrong};
  syncSession("模擬考",exam.qs,right,(exam.limit-exam.left)*1000,wrong);
  renderExamResult();
}
function renderExamResult(){
  const{rate,right,bySub,wrong}=exam.result;
  $("v-exam").innerHTML=`<div class="panel b">
    <div class="cat">第 ${week()} 週 ${exam.subject} 模擬考</div>
    <div class="big">${rate}<span style="font-size:19px">％</span></div>
    <div class="zh">${right} / ${exam.qs.length} 題正確</div>
    <table><thead><tr><th>科目</th><th>正確</th><th>正確率</th></tr></thead><tbody>
    ${Object.entries(bySub).map(([k,v])=>`<tr><td><span class="chip s-${k}">${k}</span></td>
      <td>${v.r}/${v.t}</td><td>${Math.round(v.r/v.t*100)}％</td></tr>`).join("")}
    </tbody></table></div>
    <h3>錯題檢討</h3>
    ${wrong.length?wrong.map(w=>`<div class="panel sub s-${w.it.s}" style="margin-bottom:10px">
      <div class="cat">${w.it.s}・${w.it.c}</div>
      <div class="jp ${rubyCls(showA())}" style="font-size:16px">${w.it.t==="cloze"?markedA(w.it.ja):ja_(w.it.q||"")}</div>
      <div class="fb">正解：<b class="jp">${ja_(w.right)}</b>　你選：<span class="jp" style="color:var(--suoh)">${ja_(w.pick)}</span><br>
      ${w.it.m||""}${w.it.n?`<div class="note">辨析：${w.it.n}</div>`:""}${deepHTML(w.it)}</div></div>`).join("")
      :`<div class="empty">全對。</div>`}
    <div class="row"><button class="btn primary" id="ex2">結束</button></div>`;
  $("ex2").onclick=()=>{exam=null;switchView("exam");};
}

/* ==================== 學習 ==================== */
let lst=[],li=0,rev=false;
function renderLearn(){
  if(!lst.length)lst=ITEMS.filter(i=>i.s==="文法");
  const d=lst[li],r=state.rec[d.id];
  const ans=d.t==="cloze"
    ?`<div class="ex jp ${rubyCls(showA())}">${markedA(d.ja)}</div><div class="zh">${d.zh}</div>
      ${d.n?`<div class="note">辨析：${d.n}</div>`:""}${deepHTML(d)}`
    :`<div class="ex jp ${rubyCls(showA())}">正解：${ja_(d.o[d.a])}</div><div class="zh">${d.m||""}</div>
      ${d.n?`<div class="note">${d.n}</div>`:""}${deepHTML(d)}`;
  $("v-learn").innerHTML=`
    <div class="row"><select id="ls">${SUBJ.map(s=>`<option${s===d.s?" selected":""}>${s}</option>`).join("")}</select>
      <button class="btn" id="lsh">隨機</button><span class="count">${li+1} / ${lst.length}</span></div>
    <div class="panel sub s-${d.s}">
      <div class="cat">${d.s}・${d.c}${r?` ・階段 ${r.stage}`:""}${d.D?" ・深掘":""}</div>
      ${d.t==="cloze"?`<div class="pat jp">${d.p}</div><div class="conn jp">${d.k}</div><div class="mean">${d.m}</div>`
        :d.t==="read"?`<div class="pas jp ${rubyCls(showQ())}">${nlq(d.pas)}</div><div class="stem jp ${rubyCls(showQ())}">${jq(d.q)}</div>`
        :d.t==="listen"?`<div class="pas jp ${rubyCls(showQ())}">${nlq(d.sc)}</div><div class="stem jp ${rubyCls(showQ())}">${jq(d.q)}</div>`
        :`<div class="stem jp ${rubyCls(showQ())}">${jq(d.q)}</div>`}
      <div class="${rev?"":"hidden"}">${ans}</div>
      <div class="row" style="margin-bottom:0">${rev?"":'<button class="btn primary" id="rv">顯示解說</button>'}</div>
    </div>
    <div class="row"><button class="btn" id="lp">← 上一個</button><button class="btn" id="ln">下一個 →</button></div>`;
  if($("rv"))$("rv").onclick=()=>{rev=true;renderLearn();};
  $("ls").onchange=e=>{lst=ITEMS.filter(i=>i.s===e.target.value);li=0;rev=false;renderLearn();};
  $("lsh").onclick=()=>{lst=shuffle(lst);li=0;rev=false;renderLearn();};
  $("lp").onclick=()=>{if(li>0){li--;rev=false;renderLearn();}};
  $("ln").onclick=()=>{if(li<lst.length-1){li++;rev=false;renderLearn();}};
}

/* ==================== 紀錄 ==================== */
function buildReport(){
  const bySub={};
  ITEMS.forEach(i=>{const r=state.rec[i.id];if(!r)return;
    bySub[i.s]=bySub[i.s]||{seen:0,wrong:0,mastered:0};
    bySub[i.s].seen+=r.seen;bySub[i.s].wrong+=r.wrong;if(r.stage>=3)bySub[i.s].mastered++;});
  return{v:3,date:today(),week:week(),daysLeft:days(today(),EXAM_DATE),streak:streak(),
    totals:{items:ITEMS.length,answered:state.log.length,
      acc:state.log.length?Math.round(state.log.filter(l=>l.ok).length/state.log.length*100):null},
    bySubject:bySub,
    weak:weakItems().map(d=>{const r=state.rec[d.id];return{id:d.id,
      k:plain(d.t==="cloze"?d.p:(d.o?d.o[d.a]:d.q)),s:d.s,c:d.c,stage:r.stage,wrong:r.wrong,seen:r.seen,
      picks:[...new Set(r.hist.filter(h=>h.pick).map(h=>h.pick))],
      avgSec:r.hist.length?+(r.hist.reduce((a,h)=>a+h.s,0)/r.hist.length).toFixed(1):null};}),
    slowButRight:ITEMS.filter(i=>{const r=state.rec[i.id];return r&&r.wrong===0&&r.ms>VERYSLOW;})
      .map(d=>plain(d.t==="cloze"?d.p:(d.o?d.o[d.a]:""))),
    exams:state.exams.slice(-8),
    dueNext7:[0,1,2,3,4,5,6].map(k=>({d:addDays(k),n:ITEMS.filter(i=>(state.rec[i.id]||{}).due===addDays(k)).length})),
    packs:state.packs};
}
function download(text,name){const b=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}
function bankLabel(){const b=BANK.build;
  return b?`${b.commit||"?"} ・ ${String(b.builtAt||"").slice(0,16).replace("T"," ")}`:"本機版（未經建置）";}
/* 給 Claude Code 的檢討包：附題目 ID，讓它能對照 data/*.json */
function claudeReport(){
  const r=buildReport();
  r.bank={version:bankLabel(),counts:Object.fromEntries(SUBJ.map(s=>[s,ITEMS.filter(i=>i.s===s).length]))};
  return "這是我的 N1 練習檢討包。請依 CLAUDE.md「依檢討包補題」的流程出新題並推上 GitHub。\n\n```json\n"
    +JSON.stringify(r)+"\n```";
}
function renderRec(){
  const w=weakItems().sort((a,b)=>state.rec[b.id].wrong-state.rec[a.id].wrong);
  $("v-rec").innerHTML=`
    <h3>弱點清單</h3>
    ${w.length?`<div class="row"><button class="btn shu" id="dw">用這些出題</button><span class="count">${w.length} 題</span></div>
    <table><thead><tr><th>項目</th><th>錯選內容</th><th>錯/答</th></tr></thead><tbody>
    ${w.slice(0,40).map(d=>{const r=state.rec[d.id];
      const picks=[...new Set(r.hist.filter(h=>h.pick).map(h=>h.pick))].join("、")||"—";
      return `<tr><td><span class="chip s-${d.s}">${d.s}</span><br><span class="jp">${plain(d.t==="cloze"?d.p:(d.o?d.o[d.a]:""))}</span>
        <br><span style="font-size:11.5px;color:var(--aisumi)">${d.c}</span></td>
        <td class="jp">${esc(picks)}</td><td>${r.wrong}/${r.seen}</td></tr>`;}).join("")}
    </tbody></table>`:`<div class="empty">目前沒有弱點。</div>`}
    <h3>統計</h3>
    <div class="stat">
      <div><span>${state.log.length}</span><small>累計作答</small></div>
      <div><span>${state.log.length?Math.round(state.log.filter(l=>l.ok).length/state.log.length*100):"—"}％</span><small>累計正確率</small></div>
      <div><span>${streak()}</span><small>連續天數</small></div>
      <div><span>${state.exams.length}</span><small>模考次數</small></div></div>
    <table><thead><tr><th>科目</th><th>作答</th><th>正確率</th></tr></thead><tbody>
    ${SUBJ.map(s=>{const l=state.log.filter(x=>x.sub===s);
      return `<tr><td><span class="chip s-${s}">${s}</span></td><td>${l.length}</td>
      <td>${l.length?Math.round(l.filter(x=>x.ok).length/l.length*100)+"％":"—"}</td></tr>`;}).join("")}
    </tbody></table>
    <h3>給 Claude Code 補題</h3>
    <p class="desc">複製後貼給 Claude Code，它會依你的弱點出新題並推上 GitHub，下次開 App 自動更新。</p>
    <div class="row"><button class="btn primary" id="cp">複製檢討包</button>
      <button class="btn" id="dl">下載 JSON</button><span class="count" id="msg"></span></div>
    <details><summary>預覽內容</summary><textarea id="out" readonly>${esc(claudeReport())}</textarea></details>
    <h3>題庫</h3>
    ${BANK.err?`<div class="note" style="border-color:var(--suoh);background:var(--suoh-bg)">題庫更新失敗（${esc(BANK.err)}），目前使用離線快取。</div>`:""}
    <table><thead><tr><th>科目</th><th>題數</th><th>熟練</th></tr></thead><tbody>
    ${SUBJ.map(s=>{const all=ITEMS.filter(i=>i.s===s);
      return `<tr><td><span class="chip s-${s}">${s}</span></td><td>${all.length}</td>
      <td>${all.filter(i=>(state.rec[i.id]||{}).stage>=3).length}</td></tr>`;}).join("")}
    </tbody></table>
    <p class="desc">版本：<b>${bankLabel()}</b>${(state.custom||[]).length?`<br>舊版手動匯入 ${state.custom.length} 題（repo 已收錄的以 repo 為準）`:""}</p>
    <div class="row"><button class="btn" id="rl">檢查更新</button><span class="count" id="msg2"></span></div>
    <h3>備份</h3>
    <p class="desc">紀錄存放於：<b>${STORE.label()}</b>${STORE.mode()==="local"
      ?"。清除瀏覽器資料或換手機會遺失，建議每週下載備份。":"。"}
      ${STORE.checked()&&!STORE.ok()?'<br><span style="color:var(--suoh)">寫入測試失敗，紀錄可能沒有被保存。</span>':""}</p>
    <div class="row"><button class="btn" id="bk">下載完整備份</button>
      <label class="btn">還原備份<input type="file" id="rsf" accept="application/json" hidden></label>
      <span class="count" id="msg3"></span></div>
    <details><summary>Notion 同步</summary><div class="in">
      <p class="desc">狀態：<b>${!SYNC.deployed()?"本機開啟時停用":state.notion===false?"關閉":state.notion?"開啟":"尚未偵測"}</b>　待送 ${SYNC.pending()} 筆</p>
      <div class="row"><button class="btn" id="tog">${state.notion===false?"開啟同步":"關閉同步"}</button>
        <button class="btn" id="tping">測試連線</button>
        <button class="btn" id="tflush">立即補送</button>
        <span class="count" id="smsg"></span></div></div></details>
    <div class="row"><button class="link" id="rs">清除學習紀錄</button></div>`;
  if($("dw"))$("dw").onclick=()=>start(w);
  $("cp").onclick=async()=>{const t=$("out");
    try{await navigator.clipboard.writeText(t.value);$("msg").textContent="已複製";}
    catch(e){t.closest("details").open=true;t.select();$("msg").textContent="已選取，請手動複製";}};
  $("dl").onclick=()=>download($("out").value,`n1-report-${today()}.json`);
  $("rl").onclick=async()=>{$("msg2").textContent="檢查中…";const before=ITEMS.length;
    await loadBank();buildItems();refreshHead();renderRec();
    $("msg2").textContent=BANK.err?"失敗":`完成（${ITEMS.length-before>=0?"+":""}${ITEMS.length-before} 題）`;};
  $("bk").onclick=()=>{download(JSON.stringify(state),`n1-backup-${today()}.json`);$("msg3").textContent="已下載";};
  $("rsf").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const v=JSON.parse(await f.text());if(!v.rec||!v.log)throw 0;
      if(!confirm(`還原這份備份？目前紀錄會被覆蓋。\n（備份內有 ${Object.keys(v.rec).length} 題的紀錄）`))return;
      state={...state,...v};await save();buildItems();refreshHead();renderRec();}
    catch(err){$("msg3").textContent="檔案格式錯誤";}};
  $("tog").onclick=async()=>{state.notion=state.notion===false;if(!state.notion)state.queue=[];
    await save();renderRec();};
  $("tping").onclick=async()=>{$("smsg").textContent="測試中…";
    try{const r=await SYNC.ping();$("smsg").textContent=r.body.slice(0,120);}
    catch(e){$("smsg").textContent="連線失敗："+e.message;}};
  $("tflush").onclick=async()=>{const out=await SYNC.flush();
    $("smsg").textContent=`送出 ${out.sent} 筆，剩 ${out.left} 筆`;renderRec();};
  $("rs").onclick=()=>{if(confirm("清除全部作答與複習紀錄？題庫保留。")){
    state.rec={};state.log=[];state.exams=[];state.manual=[];save();refreshHead();renderRec();}};
}

/* ==================== 切換 ==================== */
function rerender(){["today","learn","drill","exam","rec"].forEach(()=>{});switchView(view);}
function switchView(v){
  view=v;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  ["today","learn","drill","exam","rec"].forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v));
  if(v==="today")renderToday();
  if(v==="learn")renderLearn();
  if(v==="drill")sess?renderQ():renderDrillHome();
  if(v==="exam")renderExam();
  if(v==="rec")renderRec();
}
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
(async()=>{
  await load();await loadBank();buildItems();
  if(!ITEMS.length){$("v-today").innerHTML=`<div class="panel b"><div class="mean">題庫載入失敗</div>
    <p class="desc">${esc(BANK.err)}<br>第一次使用需要連上網路；連上後重新開啟即可。</p></div>`;return;}
  refreshHead();
  if(state.exam&&!state.exam.done){resumeExam();switchView("exam");}else renderToday();
  SYNC.autodetect().then(()=>SYNC.flush());
  $("fbtn").onclick=()=>{state.furi=FURI[(FURI.indexOf(state.furi)+1)%3];save();refreshHead();
    if(sess&&sess.i<sess.qs.length)renderQ();else switchView(view);};
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
    if(b.dataset.view!=="drill")sess=null;
    switchView(b.dataset.view);});
})();
</script>
</body>
